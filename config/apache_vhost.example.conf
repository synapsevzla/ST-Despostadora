#==============================================================================
# Soluciones Totales Despostadora - Plantilla de Configuración Apache / XAMPP
# Archivo: config/apache_vhost.example.conf
#==============================================================================

# -----------------------------------------------------------------------------
# OPCIÓN A (Recomendada): VirtualHost apuntando directamente a public/
# -----------------------------------------------------------------------------
# En Windows XAMPP: C:/xampp/apache/conf/extra/httpd-vhosts.conf
# En Linux Apache : /etc/apache2/sites-available/st_despostadora.conf

<VirtualHost *:80>
    ServerName despostadora.local
    ServerAlias www.despostadora.local
    
    # Ruta absoluta al subdirectorio public/ de la aplicación
    # NOTA: En Windows, use barras diagonales directas: "C:/xampp/htdocs/despostadora/public"
    DocumentRoot "/var/www/html/despostadora/public"

    <Directory "/var/www/html/despostadora/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Directivas PHP recomendadas para producción y operaciones de pesaje
    <IfModule php_module>
        php_value max_execution_time 300
        php_value memory_limit 256M
        php_value post_max_size 64M
        php_value upload_max_filesize 64M
        php_value date.timezone "America/Caracas"
    </IfModule>

    ErrorLog "logs/st_despostadora_error.log"
    CustomLog "logs/st_despostadora_access.log" combined
</VirtualHost>

# -----------------------------------------------------------------------------
# OPCIÓN B: Despliegue en Subcarpeta (XAMPP por defecto: http://localhost/despostadora/)
# -----------------------------------------------------------------------------
# 1. Extraiga la distribución dentro de: C:\xampp\htdocs\despostadora\
# 2. El archivo .htaccess de la raíz redirige automáticamente hacia public/
# 3. Acceda desde su navegador a: http://localhost/despostadora/
#
# Asegúrese de que en C:\xampp\apache\conf\httpd.conf estén activas las siguientes líneas:
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule headers_module modules/mod_headers.so
#
# Y que el bloque Directory de htdocs tenga AllowOverride All:
#   <Directory "C:/xampp/htdocs">
#       Options Indexes FollowSymLinks
#       AllowOverride All
#       Require all granted
#   </Directory>
